# eat_hwp_raw — 워크스페이스 루트.
#
# 산출물은 GUI 통합형 애드인 DLL **하나**다(별도 실행파일 없음):
#   - eat_hwp_core (lib)   : GUI·파이프라인 (#![forbid(unsafe_code)])
#   - eat_hwp_addon (cdylib): HWP 애드인 셸. 한글 안에서 단축키/버튼으로 eat_hwp_core::run_gui를
#                             별도 스레드(같은 프로세스)로 띄운다.
#
# 빌드: `cargo build`가 워크스페이스 전체를 빌드 → 산출물 DLL은
#   target/i686-pc-windows-msvc/debug/eat_hwp_addon.dll
[workspace]
resolver = "3"
members = ["crates/eat_hwp_core", "crates/eat_hwp_addon"]
