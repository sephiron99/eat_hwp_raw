# eat_hwp_raw — 워크스페이스 루트.
#
# 구조(CLAUDE.md "구조 / 산출물"): 애드온 + GUI(클라이언트)가 LLM을 직접 호출한다. 별도 서버는 보류.
# 산출물은 GUI 통합형 애드온 DLL **하나**다(별도 실행파일 없음):
# 크레이트는 eat_hwp_addon(cdylib) 하나이고 #![forbid(unsafe_code)].
#   - 애드온: 한글 안에서 단축키/버튼으로 rundll32를 spawn해 같은 DLL의 GUI를 독립 프로세스로 띄운다.
#   - GUI·파이프라인(문서 읽기, 프롬프트 구성, LLM 호출): 같은 크레이트의 모듈.
#
# 빌드: `cargo build`가 워크스페이스 전체를 빌드 → 산출물 DLL은
#   target/i686-pc-windows-msvc/debug/eat_hwp_addon.dll
[workspace]
resolver = "3"
members = ["crates/eat_hwp_addon"]
